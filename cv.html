<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon CV - Elohan</title>
<link href="style.css" rel="stylesheet">
<style>
 body {
 background-color: #E9E5E9;
 color: #ffffff;
 font-family: Arial, sans-serif;
 text-align: center;
    }
 h1 {
 color: #1d1111;
 margin-top: 30px;
    }
 .cv-container {
 display: inline-block;
 padding: 20px;
 margin: 10px;
    }
 .cv-container a {
 display: inline-block;
 width: fit-content;
    }
 .cv-miniature {
 width: 180px;
 display: block;
 border-radius: 8px;
 cursor: pointer;
 transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
 .cv-miniature:hover {
 transform: scale(1.08);
 box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
</style>
</head>
<body>
 <h1 class="oswald-font">Mon CV</h1>
 <P class="original-cv">Vous souhaitez voir mon CV dans sa taille d'origine ? Cliquez dessus !</P> 
 <div class="cv-container">
 <a href="cv-elohan.odt" target="_blank">
 <img src="cv-miniature.jfif"
 alt="Voir mon CV"
 class="cv-miniature">
 </a>
 </div>
 <br>
 <button class="bouton-accueil" onclick="window.location.href='index.html'">Retour à l'accueil</button>
</body>
</html>
